<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Vault restyle · Taelgar Art Catalog</title>
<link rel="stylesheet" href="review.css">
<link rel="stylesheet" href="review-editor.css">
</head>
<body>
<header class="top"><div class="brand"><span class="mark" aria-hidden="true">✦</span><span>Taelgar Art Catalog</span><span class="slash">/</span><strong>Vault restyle</strong></div><div class="actions"><label class="reviewer-name">Reviewer<input id="reviewerName" type="text" maxlength="80" placeholder="Your name" autocomplete="off"></label><span id="savedCount"></span><button id="import" title="Merge choices from a previously exported decisions file">Import decisions</button><input type="file" id="file" accept=".json,application/json" hidden><button id="export" title="Download all saved choices as a JSON file">Export decisions</button><button id="pull" title="Get shared decisions from GitHub">Pull only</button><button id="sync" class="primary" title="Pull and publish review entries in the public GitHub log">Sync</button></div></header>
<p id="notice" role="status" hidden></p>
<main>
<aside>
<div class="library-head"><div><h1>Illustrations</h1><small id="reviewCount"></small></div><button id="reset" class="text">Reset filters</button></div>
<label>Search<input type="search" id="query" placeholder="Title, filename, or note"></label>
<div class="pair"><label>Image type<select id="kind"><option value="">All types</option><option value="portrait">Portraits</option><option value="object">Objects</option><option value="scene">Scenes &amp; other</option></select></label><label>Decision<select id="decision"><option value="">All decisions</option><option value="open">Open</option><option value="original">Keep original</option><option value="variant">Use a version</option><option value="edits">Use with edits</option><option value="conflict">Conflicting decisions</option></select></label></div>
<label>Review<select id="reviewFilter"><option value="">All review statuses</option><option value="requested">Needs review</option><option value="approved">Approved</option><option value="rejected">Rejected</option><option value="conflict">Conflicting reviews</option></select></label>
<label id="requesterLabel" hidden>Requested by<select id="requester"><option value="">Everyone</option></select></label>
<details class="folder-picker" id="folderPicker">
 <summary><span>Linked from</span><strong id="folderName">All folders</strong></summary>
 <div class="folder-browser">
  <input type="search" id="folderSearch" aria-label="Search folders" placeholder="Find a folder…">
  <button id="folderUp" type="button" hidden></button>
  <div id="folderList" class="folder-list" aria-label="Folders"></div>
 </div>
</details>
<label>Linking note<input type="search" id="note" list="notes" placeholder="Find a note by name or path"><datalist id="notes"></datalist></label>
<div class="results-head"><span id="resultCount"></span><div class="small-nav"><button id="back" aria-label="Previous results page">←</button><span id="pageNumber"></span><button id="next" aria-label="Next results page">→</button></div></div>
<div id="list" class="list" aria-label="Matching illustrations"></div>
</aside>
<article id="detail" aria-live="polite"></article>
</main>
<dialog id="viewer" aria-label="Full-size image viewer">
 <div class="viewer-bar">
  <span id="viewer-caption" aria-live="polite"></span>
  <div class="viewer-buttons">
   <button type="button" id="viewer-prev" aria-label="Previous image" title="Previous image (←)">←</button>
   <button type="button" id="viewer-next" aria-label="Next image" title="Next image (→)">→</button>
   <button type="button" id="viewer-zoom" aria-pressed="false">Actual size</button>
   <button type="button" id="viewer-pick">Use this version</button>
   <button type="button" id="viewer-close" autofocus title="Close (Esc)">Close</button>
  </div>
 </div>
 <div id="viewer-area"><div class="viewer-canvas"><img id="viewer-image" alt=""></div>
  <p id="viewer-error" hidden>This image could not be displayed. <a id="viewer-original" target="_blank" rel="noopener">Open image file</a></p>
 </div>
</dialog>
<script src="inventory.js"></script><script src="outputs.js"></script><script src="review-log.js"></script><script src="review-editor.js"></script><script src="review.js"></script>
</body>
</html>
